name: sdk
on:
  push:
    branches: [main, m4-sdk]
  pull_request:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: pnpm install --frozen-lockfile
      - run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
        working-directory: contracts
      - run: forge build
        working-directory: contracts
      - run: pnpm --filter @session-firewall/sdk lint
      - run: pnpm --filter @session-firewall/sdk typecheck
      - run: pnpm --filter @session-firewall/sdk build
      - run: pnpm --filter @session-firewall/sdk test
      - run: pnpm --filter @session-firewall/sdk test:integration
